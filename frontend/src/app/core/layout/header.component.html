<a class="skip-link" href="#main-content">Pular para conteúdo principal</a>
<header class="app-header">
  <div class="header-container">
    <a class="header-logo" routerLink="/beneficios" aria-label="BIP Benefícios - Página inicial">
      <div class="logo-icon" aria-hidden="true">
        <i class="pi pi-wallet"></i>
      </div>
      <div class="logo-text">
        <h1>BIP</h1>
        <span>Benefícios</span>
      </div>
    </a>

    <nav class="header-nav" aria-label="Navegação principal">
      <a routerLink="/beneficios" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link" pRipple aria-label="Painel de controle">
        <i class="pi pi-home" aria-hidden="true"></i>
        <span>Início</span>
      </a>
      @if (currentUser()?.role === 'ADMIN') {
        <a routerLink="/usuarios" routerLinkActive="active" class="nav-link" pRipple aria-label="Gerenciar usuários">
          <i class="pi pi-users" aria-hidden="true"></i>
          <span>Usuários</span>
        </a>
      }
    </nav>

    <div class="header-spacer"></div>

    @if (currentUser(); as user) {
      <div class="header-user">
        <button
          pButton
          type="button"
          pRipple
          class="user-menu-toggle"
          (click)="userMenuRef.toggle($event)"
          aria-haspopup="true"
          [attr.aria-expanded]="menuOpen"
          [attr.aria-label]="'Menu do usuário: ' + user.username"
        >
          <p-avatar
            [label]="(user.username || 'U').charAt(0).toUpperCase()"
            shape="circle"
            size="large"
            styleClass="user-avatar"
          ></p-avatar>
          <span class="user-name">{{ user.username }}</span>
          <i class="pi pi-chevron-down" aria-hidden="true"></i>
        </button>

         <p-menu #userMenuRef [popup]="true" [model]="userMenuItems()" (onShow)="menuOpen=true" (onHide)="menuOpen=false"></p-menu>
      </div>
    }
  </div>
</header>
