<div class="login-wrapper">
  <div class="login-container">
    <div class="login-content">
      <!-- Header -->
      <div class="login-header">
        <div class="logo-wrapper">
          <i class="pi pi-wallet" aria-hidden="true"></i>
        </div>
        <h1 class="brand-title">BIP Benefícios</h1>
        <p class="subtitle">Sistema de Gerenciamento de Benefícios</p>
      </div>

      <div class="divider"></div>

      <!-- Form -->
      <form (submit)="onLogin(); $event.preventDefault()" class="login-form">
        <!-- Username Field -->
        <div class="field">
          <label for="username" class="label-text">
            <i class="pi pi-user" aria-hidden="true"></i>
            <span>Usuário</span>
          </label>
          <input
            id="username"
            type="text"
            pInputText
            [formField]="loginForm.username"
            placeholder="texto@exemplo.com ou nome_de_usuário"
            class="form-input"
            [class.error]="isFieldInvalid('username')"
            aria-describedby="username-error username-help"
            autocomplete="username"
            spellcheck="false"
          />
          <small class="help-text" id="username-help" [hidden]="isFieldInvalid('username')">
            <i class="pi pi-info-circle" aria-hidden="true"></i>
            Use email ou nome de usuário
          </small>
          @if (isFieldInvalid('username')) {
          <small class="error-message" id="username-error" role="alert">
            <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
            Usuário é obrigatório
          </small>
          }
        </div>

        <!-- Password Field -->
        <div class="field">
          <label for="password" class="label-text">
            <i class="pi pi-lock" aria-hidden="true"></i>
            <span>Senha</span>
          </label>
          <p-password
            id="password"
            [formField]="loginForm.password"
            placeholder="••••••••"
            [toggleMask]="true"
            [feedback]="false"
            class="form-password"
            aria-describedby="password-error password-help"
            autocomplete="current-password"
          ></p-password>
          <small class="help-text" id="password-help" [hidden]="isFieldInvalid('password')">
            <i class="pi pi-check-circle" aria-hidden="true"></i>
            Mínimo 6 caracteres
          </small>
          @if (isFieldInvalid('password')) {
          <small class="error-message" id="password-error" role="alert">
            <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
            Senha é obrigatória
          </small>
          }
        </div>

        <!-- Remember Me Checkbox -->
        <div class="remember-section">
          <div class="checkbox-wrapper">
            <p-checkbox
              [ngModel]="rememberMe()"
              (onChange)="onRememberMeChange($event)"
              [binary]="true"
              inputId="rememberMe"
              name="rememberMe"
              aria-label="Lembrar de mim neste dispositivo"
            ></p-checkbox>
            <label for="rememberMe" class="remember-label"> Lembrar de mim </label>
          </div>
          <button
            type="button"
            class="forgot-password-link"
            (click)="showForgotPasswordHelp($event)"
            aria-label="Esqueci minha senha"
          >
            Esqueci minha senha
          </button>
        </div>

        <!-- Submit Button -->
        <button
          pButton
          type="submit"
          label="Entrar"
          [loading]="loading()"
          icon="pi pi-sign-in"
          severity="secondary"
          [outlined]="true"
          class="submit-button"
          [disabled]="loginForm().invalid() || loading()"
          [attr.aria-busy]="loading()"
        ></button>
      </form>

      <!-- Footer / Demo Info -->
      <div class="login-footer">
        <p class="demo-hint">
          <i class="pi pi-lightbulb" aria-hidden="true"></i>
          <span><strong>Demo:</strong> Use admin / admin123</span>
        </p>
      </div>
    </div>
  </div>
</div>
