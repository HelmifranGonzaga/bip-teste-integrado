<div class="login-wrapper">
  <div class="login-container">
    <div class="login-content">
      <!-- Header -->
      <div class="login-header">
        <div class="logo-wrapper">
          <i class="pi pi-wallet" aria-hidden="true"></i>
        </div>
        <h1 class="brand-title">BIP Benefícios</h1>
        <p class="subtitle">Sistema de Gerenciamento de Benefícios</p>
      </div>

      <div class="divider"></div>

      <!-- Form -->
      <form (submit)="onLogin(); $event.preventDefault()" class="login-form">
        <!-- Username Field -->
        <div class="field">
          <label for="username" class="label-text">
            <i class="pi pi-user" aria-hidden="true"></i>
            <span>Usuário</span>
          </label>
          <input
            id="username"
            type="text"
            pInputText
            [formField]="loginForm.username"
            placeholder="Digite seu usuário"
            class="form-input"
            [class.has-error]="isFieldInvalid('username')"
            aria-describedby="username-error username-help"
            autocomplete="username"
            spellcheck="false"
            autofocus
          />
          @if (isFieldInvalid('username')) {
            <small class="error-message" id="username-error" role="alert">
              <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
              Usuário é obrigatório
            </small>
          } @else {
            <small class="help-text" id="username-help">
              <i class="pi pi-info-circle" aria-hidden="true"></i>
              use nome de usuário ou email
            </small>
          }
        </div>

        <!-- Password Field -->
        <div class="field">
          <label for="password" class="label-text">
            <i class="pi pi-lock" aria-hidden="true"></i>
            <span>Senha</span>
          </label>
          <p-password
            id="password"
            [formField]="loginForm.password"
            placeholder="Digite sua senha"
            [toggleMask]="true"
            [feedback]="false"
            styleClass="form-password"
            [inputStyleClass]="isFieldInvalid('password') ? 'has-error' : ''"
            aria-describedby="password-error password-help"
            autocomplete="current-password"
          ></p-password>
          @if (isFieldInvalid('password')) {
            <small class="error-message" id="password-error" role="alert">
              <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
              Senha é obrigatória
            </small>
          } @else {
            <small class="help-text" id="password-help">
              <i class="pi pi-check-circle" aria-hidden="true"></i>
              Mínimo 6 caracteres
            </small>
          }
        </div>

        <!-- Remember Me Checkbox -->
        <div class="remember-section">
          <div class="checkbox-wrapper">
            <p-checkbox
              [ngModel]="rememberMe()"
              (onChange)="onRememberMeChange($event)"
              [binary]="true"
              inputId="rememberMe"
              name="rememberMe"
              aria-label="Lembrar de mim neste dispositivo"
            ></p-checkbox>
            <label for="rememberMe" class="remember-label">Lembrar de mim</label>
          </div>
          <button
            type="button"
            class="forgot-password-link"
            (click)="showForgotPasswordHelp($event)"
            aria-label="Esqueci minha senha"
          >
            <i class="pi pi-question-circle" aria-hidden="true"></i>
            Esqueci minha senha
          </button>
        </div>

        <!-- Submit Button -->
        <button
          pButton
          type="submit"
          label="Entrar"
          [loading]="loading()"
          icon="pi pi-sign-in"
          severity="secondary"
          [outlined]="true"
          class="submit-button"
          [disabled]="loginForm().invalid() || loading()"
          [attr.aria-busy]="loading()"
        ></button>
      </form>

      <!-- Footer / Demo Info -->
      <div class="login-footer">
        <div class="demo-card">
          <div class="demo-card__icon">
            <i class="pi pi-info-circle" aria-hidden="true"></i>
          </div>
          <div class="demo-card__content">
            <span class="demo-card__label">Ambiente de Demo</span>
            <span class="demo-card__credentials">Credenciais: <code>admin</code> / <code>admin123</code></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
