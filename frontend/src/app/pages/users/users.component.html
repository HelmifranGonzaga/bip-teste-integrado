<div class="container">
  <app-page-header
    title="Usuários"
    subtitle="Gerencie os usuários do sistema e seus perfis de acesso."
  >
    <div pageHeaderActions class="page-actions">
      @if (isAdmin()) {
        <button
          pButton
          type="button"
          label="Novo Usuário"
          icon="pi pi-plus"
          severity="primary"
          (click)="openNew()"
          [disabled]="loading()"
        ></button>
      }
    </div>
  </app-page-header>

  <app-loading-spinner [loading]="loading()" title="Carregando usuários" description="Aguarde um instante enquanto buscamos a lista mais recente."></app-loading-spinner>

  <p-card styleClass="p-0">
    <div class="table-wrapper">
      <p-table
        #dt
        [value]="users()"
        [tableStyle]="{ 'min-width': '40rem' }"
        [paginator]="true"
        [rows]="10"
        [rowsPerPageOptions]="[5, 10, 20]"
        [globalFilterFields]="['username', 'nome', 'role']"
        [sortField]="'id'"
        [sortOrder]="1"
        styleClass="p-datatable-sm p-datatable-striped"
      >
        <ng-template pTemplate="caption">
          <app-table-toolbar
            title="Lista de Usuários"
            searchPlaceholder="Buscar usuários..."
            (searchChange)="onGlobalFilter(dt, $event)"
          ></app-table-toolbar>
        </ng-template>

        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="id" scope="col" style="width: 5rem">ID <p-sortIcon field="id"></p-sortIcon></th>
            <th pSortableColumn="username" scope="col">Usuário <p-sortIcon field="username"></p-sortIcon></th>
            <th pSortableColumn="nome" scope="col">Nome <p-sortIcon field="nome"></p-sortIcon></th>
            <th pSortableColumn="role" scope="col">Perfil <p-sortIcon field="role"></p-sortIcon></th>
            <th pSortableColumn="ativo" scope="col">Status <p-sortIcon field="ativo"></p-sortIcon></th>
            <th scope="col" style="width: 10rem; text-align: center">Ações</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-user>
          <tr>
            <td>{{ user.id }}</td>
            <td class="font-medium">{{ user.username }}</td>
            <td>{{ user.nome }}</td>
            <td>
              <p-tag
                [value]="user.role === 'ADMIN' ? 'Administrador' : 'Usuário'"
                [severity]="user.role === 'ADMIN' ? 'secondary' : 'info'"
                [rounded]="true"
              ></p-tag>
            </td>
            <td>
              <p-tag
                [value]="user.ativo ? 'Ativo' : 'Inativo'"
                [severity]="user.ativo ? 'success' : 'danger'"
                [rounded]="true"
              ></p-tag>
            </td>
            <td>
              <div class="flex justify-center gap-2">
                <button
                  pButton
                  type="button"
                  icon="pi pi-pencil"
                  severity="secondary"
                  [outlined]="true"
                  [rounded]="true"
                  [disabled]="loading()"
                  (click)="onEdit(user)"
                  pTooltip="Editar"
                  [attr.aria-label]="'Editar ' + user.nome"
                ></button>
                @if (isAdmin()) {
                  <button
                    pButton
                    type="button"
                    icon="pi pi-trash"
                    severity="secondary"
                    [outlined]="true"
                    [rounded]="true"
                    [disabled]="loading()"
                    (click)="onDelete(user)"
                    pTooltip="Excluir"
                    [attr.aria-label]="'Excluir ' + user.nome"
                  ></button>
                }
              </div>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="6" class="empty-state-cell">
              <app-empty-state
                icon="pi pi-users"
                title="Nenhum usuário encontrado"
                description="Use outro filtro ou crie um novo usuário."
              ></app-empty-state>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </p-card>
</div>

<p-dialog
  [header]="editingUser() ? 'Editar Usuário' : 'Novo Usuário'"
  [(visible)]="showDialog"
  (visibleChange)="onVisibleChange($event)"
  (onHide)="onDialogHide()"
  [modal]="true"
  [style]="{ width: '520px' }"
  [breakpoints]="{ '960px': '90vw', '640px': '96vw' }"
  styleClass="users-dialog app-modal"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="!saving()"
  [closeOnEscape]="!saving()"
  [closable]="!saving()"
>
  <app-user-form
    [editingUser]="editingUser()"
    [submitting]="saving()"
    [isAdmin]="isAdmin()"
    [toggling]="toggling()"
    [generatingPassword]="generatingPassword()"
    [generatedPassword]="generatedPassword()"
    (save)="onSave($event)"
    (cancel)="onCloseDialog()"
    (toggleActive)="onToggleActive($event)"
    (generatePassword)="onGeneratePassword()"
  />
</p-dialog>

<p-confirmDialog></p-confirmDialog>
