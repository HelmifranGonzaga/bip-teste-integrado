<p-card styleClass="p-0">
  <div class="table-wrapper">
    <p-table
      #dt
      [value]="beneficios"
      [tableStyle]="{ 'min-width': '40rem' }"
      [paginator]="true"
      [rows]="5"
      [rowsPerPageOptions]="[5, 10, 20]"
      [loading]="loading"
      [globalFilterFields]="['nome', 'descricao', 'valor', 'cnpjFiltro']"
      styleClass="p-datatable-sm p-datatable-striped"
    >
      <ng-template pTemplate="caption">
        <div class="beneficio-list-caption flex flex-wrap items-center justify-between gap-4">
          <h2 class="beneficio-list-title">Lista de Benefícios</h2>
          <p-iconfield iconPosition="left" class="beneficio-list-global-search">
            <p-inputicon class="pi pi-search" />
            <input
              id="beneficio-list-global-filter"
              type="text"
              pInputText
              (input)="onGlobalFilter(dt, $event)"
              placeholder="Buscar por nome, descrição, valor ou CNPJ"
              aria-label="Buscar por nome, descrição, valor ou CNPJ"
            />
          </p-iconfield>
        </div>
      </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="id" scope="col">ID <p-sortIcon field="id"></p-sortIcon></th>
          <th pSortableColumn="nome" scope="col">Nome <p-sortIcon field="nome"></p-sortIcon></th>
          <th pSortableColumn="cnpj" scope="col">CNPJ <p-sortIcon field="cnpj"></p-sortIcon></th>
          <th pSortableColumn="descricao" scope="col">Descrição <p-sortIcon field="descricao"></p-sortIcon></th>
          <th pSortableColumn="valor" scope="col">Valor <p-sortIcon field="valor"></p-sortIcon></th>
          <th pSortableColumn="ativo" scope="col">Ativo <p-sortIcon field="ativo"></p-sortIcon></th>
          <th scope="col" style="width: 8rem; text-align: center">Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td>{{ item.id }}</td>
          <td class="font-medium">{{ item.nome }}</td>
          <td class="text-color-secondary">{{ item.cnpjMascarado || '—' }}</td>
          <td class="text-color-secondary">{{ item.descricao }}</td>
          <td class="font-semibold">{{ item.valor | currency: 'BRL' : 'symbol' : '1.2-2' : 'pt-BR' }}</td>
          <td>
            <i
              class="pi"
              [ngClass]="{
                'text-green-500 pi-check-circle': item.ativo,
                'text-red-500 pi-times-circle': !item.ativo
              }"
            ></i>
          </td>
          <td>
            <div class="flex justify-center gap-2">
              <button
                pButton
                type="button"
                icon="pi pi-pencil"
                severity="info"
                [rounded]="true"
                [text]="true"
                [disabled]="loading"
                [attr.aria-label]="getEditLabel(item)"
                (click)="edit.emit(item)"
                pTooltip="Editar"
              ></button>
              <button
                pButton
                type="button"
                icon="pi pi-trash"
                severity="danger"
                [rounded]="true"
                [text]="true"
                [disabled]="loading"
                [attr.aria-label]="getRemoveLabel(item)"
                (click)="remove.emit(item.id)"
                pTooltip="Excluir"
              ></button>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="text-center p-4">Nenhum benefício encontrado.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</p-card>
