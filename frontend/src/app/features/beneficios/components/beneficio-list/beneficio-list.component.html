<p-card styleClass="p-0">
  <div class="table-wrapper">
    <p-table
      #dt
      [value]="beneficios"
      [tableStyle]="{ 'min-width': '40rem' }"
      [paginator]="true"
      [rows]="rows"
      [rowsPerPageOptions]="[5, 10, 20, 50]"
      [totalRecords]="totalRecords"
      [loading]="loading"
      [lazy]="false"
      (onLazyLoad)="onLazyLoad($event)"
      [globalFilterFields]="lazy ? undefined : ['nome', 'descricao', 'valor', 'cnpjFiltro']"
      [sortField]="'id'"
      [sortOrder]="-1"
      styleClass="p-datatable-sm p-datatable-striped"
    >
      <ng-template pTemplate="caption">
          <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
            <h2 style="margin: 0; font-size: 1.25rem; font-weight: 600; color: #141413; font-family: 'Poppins', sans-serif;">Lista de Benefícios</h2>
            <p-iconfield iconPosition="left" style="margin-left: auto;">
              <p-inputicon>
                <i class="pi pi-search"></i>
              </p-inputicon>
              <input
                pInputText
                type="text"
                (input)="dt.filterGlobal($event.target.value, 'contains')"
                placeholder="Buscar benefícios..."
                style="width: min(100%, 350px);"
              />
            </p-iconfield>
          </div>
        </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="id" scope="col">ID <p-sortIcon field="id"></p-sortIcon></th>
          <th pSortableColumn="nome" scope="col">Nome <p-sortIcon field="nome"></p-sortIcon></th>
          <th pSortableColumn="cnpj" scope="col">CNPJ <p-sortIcon field="cnpj"></p-sortIcon></th>
          <th pSortableColumn="descricao" scope="col">Descrição <p-sortIcon field="descricao"></p-sortIcon></th>
          <th pSortableColumn="valor" scope="col">Valor <p-sortIcon field="valor"></p-sortIcon></th>
          <th pSortableColumn="ativo" scope="col">Ativo <p-sortIcon field="ativo"></p-sortIcon></th>
          <th scope="col" style="width: 8rem; text-align: center">Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td>{{ item.id }}</td>
          <td class="font-medium">{{ item.nome }}</td>
          <td class="text-color-secondary">{{ item.cnpjMascarado || '—' }}</td>
          <td class="text-color-secondary">{{ item.descricao }}</td>
          <td class="font-semibold">{{ item.valor | currency: 'BRL' : 'symbol' : '1.2-2' : 'pt-BR' }}</td>
          <td>
            <p-tag
              [value]="item.ativo ? 'Ativo' : 'Inativo'"
              [severity]="item.ativo ? 'success' : 'danger'"
              [rounded]="true"
            ></p-tag>
          </td>
          <td>
            <div class="flex justify-center gap-2">
              <button
                pButton
                type="button"
                icon="pi pi-pencil"
                severity="secondary"
                [outlined]="true"
                [rounded]="true"
                [disabled]="loading"
                [attr.aria-label]="getEditLabel(item)"
                (click)="edit.emit(item)"
                pTooltip="Editar"
              ></button>
              <button
                pButton
                type="button"
                icon="pi pi-trash"
                severity="secondary"
                [outlined]="true"
                [rounded]="true"
                [disabled]="loading"
                [attr.aria-label]="getRemoveLabel(item)"
                (click)="remove.emit(item.id)"
                pTooltip="Excluir"
              ></button>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="empty-state-cell">
            <div class="empty-state">
              <i class="pi pi-box empty-state__icon" aria-hidden="true"></i>
              <div class="empty-state__content">
                <strong>Nenhum benefício encontrado</strong>
                <span>Tente outro filtro ou crie o primeiro benefício.</span>
              </div>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</p-card>
