<p-card header="Benefícios">
  <div class="table-wrapper">
    <p-table
      [value]="beneficios"
      [tableStyle]="{ 'min-width': '40rem' }"
      [paginator]="true"
      [rows]="5"
      [rowsPerPageOptions]="[5, 10, 20]"
      [loading]="loading"
      styleClass="p-datatable-striped"
    >
      <ng-template pTemplate="header">
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Nome</th>
          <th scope="col">Descrição</th>
          <th scope="col">Valor</th>
          <th scope="col">Ativo</th>
          <th scope="col" style="width: 12rem">Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td>{{ item.id }}</td>
          <td>{{ item.nome }}</td>
          <td>{{ item.descricao }}</td>
          <td>{{ item.valor | currency: 'BRL' : 'symbol' : '1.2-2' : 'pt-BR' }}</td>
          <td>
            <i
              class="pi"
              [ngClass]="{
                'text-green-500 pi-check-circle': item.ativo,
                'text-red-500 pi-times-circle': !item.ativo
              }"
            ></i>
          </td>
          <td>
            <div class="flex gap-2">
              <p-button
                icon="pi pi-pencil"
                severity="success"
                [rounded]="true"
                [text]="true"
                [disabled]="loading"
                [attr.aria-label]="getEditLabel(item)"
                (onClick)="edit.emit(item)"
                pTooltip="Editar"
              ></p-button>
              <p-button
                icon="pi pi-trash"
                severity="danger"
                [rounded]="true"
                [text]="true"
                [disabled]="loading"
                [attr.aria-label]="getRemoveLabel(item)"
                (onClick)="remove.emit(item.id)"
                pTooltip="Excluir"
              ></p-button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</p-card>
