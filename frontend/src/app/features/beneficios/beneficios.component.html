<p-confirmDialog></p-confirmDialog>

<div class="container">
  <app-page-header title="Painel de Controle" subtitle="Gerencie seus benefícios e transfira saldos de forma segura.">
    <div pageHeaderActions>
      <app-page-actions>
        <button pButton type="button" label="Exportar CSV" icon="pi pi-download" severity="secondary" [outlined]="true" (click)="exportCsv()"></button>
        <button pButton type="button" label="Transferir Saldo" icon="pi pi-arrow-right-arrow-left" severity="secondary" [outlined]="true" (click)="openTransfer()"></button>
        <button pButton type="button" label="Novo Benefício" icon="pi pi-plus" severity="primary" (click)="openNew()"></button>
      </app-page-actions>
    </div>
  </app-page-header>

  @if (!connectionError()) {
    <app-beneficio-list
      [beneficios]="beneficios()"
      [loading]="loadingService.uiLoading()"
      [lazy]="lazyMode()"
      [totalRecords]="totalRecords()"
      (edit)="onEdit($event)"
      (remove)="onRemove($event)"
      (lazyLoad)="onLazyLoad($event)"
    ></app-beneficio-list>
  } @else {
    <app-connection-error
      [errorMessage]="errorMessage()"
      [networkOnline]="reconnectionService.networkOnline()"
      [reconnecting]="reconnectionService.reconnecting()"
      [reconnectAttempts]="reconnectionService.reconnectAttempts()"
      [reconnectExhausted]="reconnectionService.reconnectExhausted()"
      [countdown]="reconnectionService.countdown()"
      [diagnosticCode]="reconnectionService.diagnosticCode()"
      [isProduction]="isProduction"
      (retry)="retryNow()"
      (reload)="reloadPage()"
      (contactSupport)="openSupportContact()"
      (copyDiagnostic)="onCopyDiagnostic()"
    ></app-connection-error>
  }
</div>

<p-dialog
  header="Editar Benefício"
  [visible]="showFormModal()"
  (visibleChange)="showFormModal.set($event)"
  (onHide)="onFormModalHide()"
  [modal]="true"
  [style]="{ width: '520px' }"
  [breakpoints]="{ '960px': '90vw', '640px': '96vw' }"
  styleClass="beneficio-dialog app-modal"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="!loadingService.loading()"
>
  <app-beneficio-form
    [editingBeneficio]="editingBeneficio()"
    [submitting]="loadingService.loading()"
    (save)="onSave($event)"
    (cancelOperation)="onCancelEdit()"
  ></app-beneficio-form>
</p-dialog>

<p-dialog
  header="Transferência de Saldo"
  [visible]="showTransferModal()"
  (visibleChange)="showTransferModal.set($event)"
  (onHide)="onTransferModalHide()"
  [modal]="true"
  [style]="{ width: '520px' }"
  [breakpoints]="{ '960px': '90vw', '640px': '96vw' }"
  styleClass="beneficio-dialog app-modal"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="!loadingService.loading()"
>
  <app-beneficio-transfer
    [beneficios]="beneficios()"
    [submitting]="loadingService.loading()"
    (transfer)="onTransfer($event)"
    (cancelTransfer)="onCancelTransfer()"
  ></app-beneficio-transfer>
</p-dialog>
