<section class="page-header mb-4" aria-label="Cabecalho da pagina">

    <h1 class="page-title m-0">{{ title }}</h1>
    <p class="page-subtitle m-0">{{ subtitle }}</p>
  </div>
  <div class="page-actions">
    <ng-content select="[pageHeaderActions]"></ng-content>
  </div>
</section>
