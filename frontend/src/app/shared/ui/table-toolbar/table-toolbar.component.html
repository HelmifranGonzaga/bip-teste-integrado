<div class="table-caption" role="search" [attr.aria-label]="title">
  <h2 class="table-caption__title">{{ title }}</h2>
  <div class="table-caption__search-wrapper">
    <p-iconfield iconPosition="left" class="table-caption__search">
      <p-inputicon>
        <i class="pi pi-search" aria-hidden="true"></i>
      </p-inputicon>
      <input
        pInputText
        type="text"
        [ngModel]="currentValue()"
        (input)="onSearchInput($event)"
        [placeholder]="searchPlaceholder"
        class="table-caption__input"
        [attr.aria-label]="'Buscar em ' + title"
      />
    </p-iconfield>
    @if (currentValue()) {
      <button
        pButton
        type="button"
        icon="pi pi-times"
        class="p-button-text p-button-sm table-caption__clear"
        (click)="clearSearch()"
        aria-label="Limpar busca"
      ></button>
    }
  </div>
</div>
