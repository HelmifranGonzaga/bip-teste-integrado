services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beneficios
      POSTGRES_USER: bip
      POSTGRES_PASSWORD: bip@123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bip -d beneficios"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - JWT_SECRET=/eZQxAE8tR6y7dqaaRxCgdneVQzIx7a+VSjfjSRkSy/zpV1hkEk9n7qvQSb3ojIssds0K6fPgQMoCIZwtqz6HQ==
      - CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost,http://127.0.0.1:4200
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/beneficios
      - SPRING_DATASOURCE_USERNAME=bip
      - SPRING_DATASOURCE_PASSWORD=bip@123
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
