spring:
  h2:
    console:
      enabled: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-jwt-secret-please-change-before-shared-0123456789-abcdef}
    expose-dev-endpoints: true
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Alinhado com CorsConfig (@Value cors.allowed-origins); perfil local costuma servir o frontend em 4200.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

logging:
  level:
    com.example: INFO
    org.springframework.retry: INFO
    org.springframework.security: DEBUG
